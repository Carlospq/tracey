<head>
	<style>
		#protein-display {
			margin: 15px;
			height: 60vh;
			width: 60vw;
			border: 1px solid black;
			display: flex;
		}
		#proteinViewerContainer {
			height: 99%;
			width: 99%;
			margin: 1px;
			position: relative;
		}
		#toggleSpin {
			position: absolute;
			height: 2em;
			top: 23px;
			left: 30px;
			z-index: 10;
			padding: 5px 10px;
			background-color: rgba(150, 150, 150, 0.8);
			border: none;
			border-radius: 5px;
			cursor: pointer;
			font-size: 12px;
		}
		#cif {
			position: absolute;
			height: 1em;
			top: calc(60vh - 15px);
			left: calc(60vw - 75px);
			z-index: 10;
			padding: 5px 10px;
			background-color: rgba(150, 150, 150, 0.8);
			border: none;
			border-radius: 5px;
			cursor: pointer;
			font-size: 12px;
		}
		#cif a {
			text-decoration: none;
			color: black;
			font-family: Arial, sans-serif;
		}
    </style>
</head>

<!-- 3Dmol.js Protein Viewer -->
<div id="protein-display">

	<div id="proteinViewerContainer">
		{{ motif_coords|json_script:"data-motifs" }}
	</div>

	<!-- If structure not found -->
	{% if not fetch3d %}
	<div class="loadingmessage">L3D Structure not found...</div>
	{% endif %}

	<!-- Spin button -->
	<button id="toggleSpin">Stop spin</button>

	<!-- Download button -->
	<div id="cif"><a href="{{ fetch3d }}" target="_blank">Download .cif</a></div>

</div>



<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<script src="https://3Dmol.org/build/3Dmol.ui-min.js"></script>
<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js" type="text/javascript"></script>
<script>
	let viewerContainer = document.getElementById('proteinViewerContainer');
	let viewer = $3Dmol.createViewer( viewerContainer, {} );
	const domainColors = {
		"SNARE": "orange",
		"Habc": "purple",
		"C2": "red",
		"default": "green"
	};
	window.addEventListener("DOMContentLoaded", function() {
		let pdbUri = '{{ fetch3d }}';
		var motifsData = JSON.parse(document.getElementById('data-motifs').textContent);
		fetch(pdbUri)
			.then( response => response.text() )
			.then( data => {
				viewer.addModel( data, "cif" );
				viewer.setStyle({}, {cartoon: {color: 'blue'}});
				{# Color each motif #}
				for (const [key, value] of Object.entries(motifsData)) {
					viewer.addStyle({resi: [`${value.start}-${value.end}`]}, {cartoon: {color: domainColors[value.domain] || domainColors.default }});
				}
				viewer.spin("y", 0.2);
				viewer.enableFog(false);
				viewer.setCameraParameters({ fov: 40 , z: 100, far: 10000 });
				viewer.zoomTo();
				viewer.render();
			})
			.catch( error => {
				console.error('Error loading 3D structure:', error);
				let loadingMessage = document.querySelector('.loadingmessage');
				if (loadingMessage) {
					loadingMessage.textContent = 'Error loading 3D structure.';
				}
			});
	});
	let isSpinning = true;
	document.getElementById("toggleSpin").addEventListener("click", () => {
		if (isSpinning) {
			viewer.spin(false);		// stop spinning
			isSpinning = false;
			toggleSpin.textContent = "Start spin";
		} else {
			viewer.spin("y", 0.2);	// start spinning (axis, speed)
			isSpinning = true;
			toggleSpin.textContent = "Stop spin";
		}
	});
</script>

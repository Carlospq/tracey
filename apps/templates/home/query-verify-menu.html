{% extends "layouts/base.html" %}

{% block title %} UI Forms {% endblock %}

<!-- Specific Page CSS goes HERE  -->
{% block stylesheets %}
<style>
  .tdlabel {
    white-space: nowrap;
    text-alignt: left;
    vertical-align: middle;
    padding: 0.5em;
    border: red solid 1px;
  }
  .tdfield{
    white: 100%;
    text-align: center;
    text-alignt: left;
    padding: 0.5em;
    border: blue solid 1px;
  }
</style>
{% endblock stylesheets %}

{% block content %}

<div class="row mt-4">
    <div class="container">

        <!-- Card frame -->
        <div class="card border-0 shadow components-section">

            <!-- Card body -->
            <div class="col-12 mb-4">
                <div class="card-body">

                    <div class="mb-5">
                        <h1><strong> Verify Motifs </strong></h1>
                        <p><i>Verify and update sequences in Tracey.</i></p>
                        <hr>
                    </div>

                    <div class="row mb-4">
                    <div class="col-sm-12">

                        <!-- Row 1 - Select sequence -->
                        <div class="col-lg-12 col-sm-12">
                            <table>
                                <tr>
                                    <td class="tdlabel">
                                        <label for="verify"> Sequence status </label>
                                    </td>
                                    <td class="tdfield">
                                        <select style="width: 100%;" name="sequencestatus" id="sequencestatus">
                                            {% for stat in status %}
                                                <option value= "{{ stat }}"> {{ stat }} </option>
                                            {% endfor %}
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="tdlabel">
                                        <label for="verify"> Private </label>
                                    </td>
                                    <td class="tdfield">
                                        <select style="width: 100%;" name="private" id="private">
                                            <option value= "{{ 1 }}" selected> Yes </option>
                                            <option value= "{{ 0 }}"> No </option>
                                        </select>
                                    </td>
                                </tr>
                            </table>
                        </div>
                        <hr>

                    </div>
                    </div>

                </div>
            </div>
            <!-- End Card body -->
        </div>
        <!-- Card frame -->
    </div>
</div>

{% endblock content %}

<!-- Specific Page JS goes HERE  -->
{% block javascripts %}{% endblock javascripts %}

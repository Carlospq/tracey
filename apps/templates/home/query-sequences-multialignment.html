<head>
  <style type="text/css">
    .alignment {
      max-height: 900px;
      overflow-x: scroll;
      scrollbar-color: white black;
      display: inline-block;
      border: black solid 1px;
    }
	  .detailTable{
      width: 100%;
      white-space: nowrap;
      word-wrap: break-word;
      word-break: break-word;
	  }
		.detailTable td{
      text-align: left;
      padding-bottom: 5px;
      width:100%;
    }
    tr:nth-child(even) {background-color: #f2f2f2;}
	</style>
</head>

<div style="width:100%; word-wrap: break-word; word-break: break-word;">
	{% if names|length < 2 %}

			Plase select at least 2 sequence to obtain an alignment.

	{% else %}

          <div class="alignment" id="left" style="width: 20%;">
              <table class="detailTable">
                {% for name in names %}
                <tr><td style="padding-left: 15px; padding-right: 15px; font-size: 18px; font-family: Arial, sans-serif;">{{ name }}</td></tr>
                {% endfor %}
              </table>
          </div>
          <div class="alignment" id="right" style="width: 79.5%;">
              <table class="detailTable">
                  {% for name in names %}
                  <tr>
                      {%for a, b in zippedLists|get_item:name %}
                          <td style="padding-left: 5px; text-align: center; font-size: 18px; font-family: Arial, sans-serif;" {% if b == 1 %} bgcolor="cyan" {% endif %}">{{ a }}</td>
                      {% endfor %}
                      <!-- {% for leter in alignment %}
                      <td style="text-align: center; font-size: 18px; font-family: Arial, sans-serif;">{{ leter }}</td>
                      {% endfor %} -->
                  </tr>
                  {% endfor %}
              </table>
          </div>

	{% endif %}
</div>

<script src="{{ ASSETS_ROOT }}/js/jquery-3.3.1.min.js"></script>
<script type="text/javascript">
  $('#left').on('scroll', function () {
      $('#right').scrollTop($(this).scrollTop());
  });
  $('#right').on('scroll', function () {
      $('#left').scrollTop($(this).scrollTop());
  });
</script>

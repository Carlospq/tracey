# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Python deps — requirements.txt + requirements-dev.txt.
  # Monthly: on EOL Django 4.2 most version-updates fail CI (deps now need
  # Django 5.x / Python 3.11+), so weekly was mostly noise. Back to weekly after
  # the Django 5.x + Python 3.12 upgrade. Security updates are unaffected.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    groups:
      # One PR/week for safe (minor + patch) bumps; majors get their own PR
      # so a risky Django/tables2/csp jump is reviewed on its own.
      safe-updates:
        update-types: ["minor", "patch"]
    ignore:
      # These don't follow semver in a way that makes "minor" safe:
      #  - scikit-learn: must match the version that pickled utils/motifPredictor/lm_*.sav
      #  - pyhmmer / biopython: 0.x-ish, C-extension API churn between minors
      #  - numpy: ABI-coupled to scipy/scikit-learn/pandas builds
      - dependency-name: "scikit-learn"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "pyhmmer"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "biopython"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    labels: ["dependencies"]

  # Keep the GitHub Actions in .github/workflows/ up to date
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
